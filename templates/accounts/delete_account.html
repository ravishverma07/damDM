{% extends "base.html" %}
{% block title %}Delete account · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="card card--narrow">
  <h1>Delete account</h1>
  <p class="text-sm muted">
    This erases your profile, automations, message logs and every stored Instagram
    token. It cannot be undone.
  </p>
  <form method="post" novalidate>
    {% include "partials/form.html" %}
    <button type="submit" class="btn btn--danger btn--block">Permanently delete my account</button>
  </form>
</div>
{% endblock %}
