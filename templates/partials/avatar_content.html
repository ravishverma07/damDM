{# Inside an .avatar: the profile photo if we have one, over the initial (shown if it fails to load). #}
{% if person.avatar_url %}<img class="avatar__img" src="{{ person.avatar_url }}" alt="" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="this.remove()">{% endif %}{{ person.get_short_name|first|upper }}
