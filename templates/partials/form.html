{% csrf_token %}
{% if form.non_field_errors %}
  <div class="alert alert--error">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="field__help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
